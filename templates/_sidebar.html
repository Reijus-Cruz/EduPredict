<!-- Sidebar partial – included by all authenticated pages -->
<nav class="sidebar">
    <div class="sidebar-brand">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422A12.083 12.083 0 0121 12.5C21 17.194 16.97 21 12 21S3 17.194 3 12.5c0-.538.05-1.064.146-1.575L12 14z"/></svg>
        PredictEd
    </div>
    <div class="sidebar-nav">
        {% if current_user.is_staff %}
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">
            📊 Dashboard
        </a>
        <a href="{{ url_for('students') }}" class="{{ 'active' if request.endpoint == 'students' }}">
            👥 Students
        </a>
        <a href="{{ url_for('class_records') }}" class="{{ 'active' if request.endpoint == 'class_records' }}">
            📝 Class Records
        </a>
        <a href="{{ url_for('reports') }}" class="{{ 'active' if request.endpoint == 'reports' }}">
            📄 Reports
        </a>
        <a href="{{ url_for('analytics') }}" class="{{ 'active' if request.endpoint == 'analytics' }}">
            📈 Analytics
        </a>
        <a href="{{ url_for('interventions') }}" class="{{ 'active' if request.endpoint == 'interventions' }}">
            🩺 Interventions
        </a>
        {% else %}
        <a href="{{ url_for('student_profile', student_id=current_user.student_id) }}" class="{{ 'active' if request.endpoint == 'student_profile' }}">
            🏠 My Profile
        </a>
        <a href="{{ url_for('class_records') }}" class="{{ 'active' if request.endpoint == 'class_records' }}">
            📝 My Grades
        </a>
        {% endif %}
        <a href="{{ url_for('what_if') }}" class="{{ 'active' if request.endpoint == 'what_if' }}">
            🔮 What-If
        </a>
    </div>
    <div class="sidebar-footer">
        Logged in as <strong>{{ current_user.username }}</strong>
        <span class="badge badge-cluster" style="margin-left:.3rem;">{{ current_user.role }}</span><br>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>
